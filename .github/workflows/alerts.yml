# Installed from alerts/workflow.yml. Edit alerts/positions.json to choose what is
# watched, and see alerts/README.md for the notification secrets.
#
# With no secrets set this still runs green: it prints what it would have sent to the
# Actions log rather than failing. To stop it, delete this file or disable it in the
# Actions tab.

name: Pool alerts

on:
  schedule:
    #
    # Measured, not assumed: configured at */30, this actually ran every ~5 hours -- 14 runs
    # where 136 were expected, a median gap of 301 minutes and a worst case of 439. GitHub
    # deprioritises scheduled workflows on public repos, and the queue is worst on the hour.
    #
    # The offsets below avoid :00 and :30, which measurably reduces the wait. Treat the real
    # cadence as hours rather than minutes and size the alert thresholds accordingly -- the
    # edge-triggered state in alerts/state.json means a late run still fires the right alert,
    # it just fires it late.
    - cron: '7,37 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Needed so the job can commit state.json back and fire on the edge rather than every run.
permissions:
  contents: write

concurrency:
  group: pool-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Evaluate alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node alerts/check.mjs

      - name: Remember what has already fired
        run: |
          if [[ -n "$(git status --porcelain alerts/state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerts/state.json
            git commit -m "chore: alert state [skip ci]"
            git push
          else
            echo "No state change."
          fi
