# Pristine copy of the installed workflow. The live one is .github/workflows/alerts.yml;
# keep them in step if you edit either. See alerts/README.md.

name: Pool alerts

on:
  schedule:
    # Every 30 minutes. GitHub queues scheduled runs, so expect some drift.
    - cron: '*/30 * * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Needed so the job can commit state.json back and fire on the edge rather than every run.
permissions:
  contents: write

concurrency:
  group: pool-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Evaluate alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node alerts/check.mjs

      - name: Remember what has already fired
        run: |
          if [[ -n "$(git status --porcelain alerts/state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerts/state.json
            git commit -m "chore: alert state [skip ci]"
            git push
          else
            echo "No state change."
          fi
